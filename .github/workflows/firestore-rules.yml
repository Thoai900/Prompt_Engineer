name: Deploy Firestore rules

# Tự deploy firestore.rules lên Firebase khi file đổi trên master.
# Cần secret FIREBASE_SERVICE_ACCOUNT (toàn bộ JSON service account, quyền Firebase Rules Admin hoặc Editor).
on:
  push:
    branches: [master]
    paths:
      - firestore.rules
      - firebase.json
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy rules
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project eduai-nexus --non-interactive
